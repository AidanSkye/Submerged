plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "submerged" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name "Modrinth"
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // CCA, Ratatouille
    maven {
        name "Ladysnake Mods"
        url "https://maven.ladysnake.org/releases"
    }

    maven {
        url "https://maven.uuid.gg/releases"
        name "Datasync"
    }

    maven {
        url "https://maven.maxhenkel.de/repository/public"
    }

    maven {
        url = "https://maven.maxhenkel.de/repository/public"
    }

    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modApi "dev.doctor4t:wathe:1.3.2-1.21.1"
    modImplementation include ("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
    modImplementation include ("org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}")
    modImplementation include ("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")
    modImplementation include ("org.ladysnake.cardinal-components-api:cardinal-components-scoreboard:${project.cca_version}")
    modImplementation "dev.doctor4t:ratatouille:${project.ratatouille_version}"
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:0.5.3")))

    modImplementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    modApi "maven.modrinth:harpymodloader:${project.harpymodloader_version}"
    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

    modCompileOnly "maven.modrinth:gexpress:${project.gexpress_version}"
    modImplementation "maven.modrinth:wathe-extended:${project.watheextended_version}"
    modCompileOnly "maven.modrinth:moving-elevators:${project.movingelevators_version}-fabric-mc1.21"
    modCompileOnly "maven.modrinth:wathe-blood:${project.wathe_blood_version}"
    modCompileOnly "maven.modrinth:kinswathe:${project.kinswathe_version}"
    modCompileOnly "maven.modrinth:stupid-express:${project.stupid_express_version}"
    modCompileOnly "maven.modrinth:noelles-roles-tmm:${project.noelles_roles_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "wathe_version": project.wathe_version,
                "voicechat_api_version": project.voicechat_api_version,
                "gexpress_version": project.gexpress_version,
                "watheextended_version": project.watheextended_version,
                "kinswathe_version": project.kinswathe_version,
                "stupid_express_version": project.stupid_express_version,
                "harpymodloader_version": project.harpymodloader_version,
                "noelles_roles_version": project.noelles_roles_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
